openapi: 3.0.3

info:
  title: Contrato de API para Inventario de Proyectos 480:DEV
  version: 2.0.0
  description: |
    API de gestión de inventario de proyectos. Permite administrar usuarios, clientes,
    proyectos, desarrollos e imputaciones de horas.
  contact:
    name: API Support

servers:
  - url: /api/v1
    description: Base URL

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Autenticación y MFA

  - name: Users
    description: Gestión de usuarios

  - name: Dashboard
    description: Operaciones del panel principal del usuario

  - name: Clients
    description: Gestión de clientes

  - name: Projects
    description: Gestión de proyectos

  - name: Sectors
    description: Catálogo de sectores

  - name: Technologies
    description: Gestión de tecnologías

paths:

  # ================================================================
  #  AUTHENTICATION
  # ================================================================

  /login:
    post:
      tags: [ Authentication ]
      summary: Autenticación de usuario
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: ana@empresa.com
                password:
                  type: string
                  maxLength: 255
                  example: "S3cur3P@ssword"
              required: [ email, password ]
      responses:
        "200":
          description: Autenticación correcta
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Segundos hasta la expiración del token
                    example: 3600
                  expires_at:
                    type: string
                    format: date-time
                    description: Fecha y hora de expiración del token
                    example: "2025-04-09T12:00:00Z"
                required: [ access_token, token_type, expires_in, expires_at ]
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - El email o contraseña son incorrectos
                required: [ status, error, message ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]

  /mfa:
    post:
      tags: [ Authentication ]
      summary: Autenticación de múltiples factores
      operationId: mfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  format: uuid
                  example: 00000000-0000-0000-0000-000000000004
                code:
                  type: string
                  example: "123456"
              required: [ session_id, code ]
      responses:
        "200":
          description: MFA correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Segundos hasta la expiración del token
                    example: 3600
                  expires_at:
                    type: string
                    format: date-time
                    description: Fecha y hora de expiración del token
                    example: "2025-04-09T12:00:00Z"
                required: [ access_token, token_type, expires_in, expires_at ]
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - El código MFA es inválido o ha expirado
                required: [ status, error, message ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido, ausente o sesión MFA expirada
                required: [ status, error, message ]

  /users/{id}/password-change:
    post:
      tags: [ Authentication ]
      summary: Cambiar contraseña de usuario con validación de contraseña original
      operationId: changeUserPassword
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  maxLength: 255
                  example: "S3cur3P@ssword"
                new_password:
                  type: string
                  maxLength: 255
                  example: "N3wP@ssw0rd"
              required: [ current_password, new_password ]
      responses:
        "204":
          description: Contraseña actualizada
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - Parámetros incorrectos
                required: [ status, error, message ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Usuario no encontrado
                required: [ status, error, message ]

  /users/{id}/admin-password:
    post:
      tags: [ Authentication ]
      summary: Cambiar contraseña de usuario con privilegios de administrador
      operationId: changeUserPasswordAsAdmin
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  maxLength: 255
                  example: "N3wAdm1nP@ssw0rd"
              required: [ new_password ]
      responses:
        "204":
          description: Contraseña actualizada por administrador
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - La nueva contraseña no cumple los requisitos
                required: [ status, error, message ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes (solo administradores)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: Solo los administradores pueden cambiar contraseñas de otros usuarios
                required: [ status, error, message ]
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Usuario no encontrado
                required: [ status, error, message ]

  # ================================================================
  #  USERS
  # ================================================================

  /users:

    post:
      tags: [ Users ]
      summary: Crear usuario
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: 00000000-0000-0000-0000-000000000001
                name:
                  type: string
                  maxLength: 100
                  example: Carlos
                surname:
                  type: string
                  maxLength: 100
                  example: Ruiz
                email:
                  type: string
                  format: email
                  maxLength: 150
                  example: carlos@empresa.com
                password:
                  type: string
                  maxLength: 255
                  example: "S3cur3P@ssword"
                role:
                  type: string
                  enum: [ ROLE_ADMIN, ROLE_EMPLOYEE ]
                  example: ROLE_EMPLOYEE
              required: [ name, surname, email, password, role ]
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - El email o los datos requeridos son inválidos
                required: [ status, error, message ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: No tienes permisos para acceder a este recurso
                required: [ status, error, message ]
        "409":
          description: Conflicto - recurso ya existente (ej. email duplicado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 409
                  error:
                    type: string
                    example: Conflict
                  message:
                    type: string
                    example: El email ya está registrado
                required: [ status, error, message ]

    get:
      tags: [ Users ]
      summary: Listado de usuarios
      operationId: getUsers
      parameters:
        - name: is_active
          in: query
          description: Filtrar por usuarios activos o inactivos
          schema:
            type: boolean
        - name: role
          in: query
          description: Filtrar por rol de usuario
          schema:
            type: string
            enum: [ ROLE_ADMIN, ROLE_EMPLOYEE ]
            example: ROLE_EMPLOYEE
        - name: page
          in: query
          description: Página de resultados
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Límites de resultados por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Listado de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 00000000-0000-0000-0000-000000000001
                    name:
                      type: string
                      example: Ana
                    surname:
                      type: string
                      example: García
                    email:
                      type: string
                      format: email
                      example: ana@empresa.com
                    is_active:
                      type: boolean
                      example: true
                    role:
                      type: string
                      enum: [ ROLE_ADMIN, ROLE_EMPLOYEE ]
                      example: ROLE_EMPLOYEE
                  required: [ id, name, surname, email, is_active, role ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: No tienes permisos para acceder a este recurso
                required: [ status, error, message ]
  /users/{id}:
    get:
      tags: [ Users ]
      summary: Obtener usuario por ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 00000000-0000-0000-0000-000000000001
                  name:
                    type: string
                    example: Ana
                  surname:
                    type: string
                    example: García
                  email:
                    type: string
                    format: email
                    example: ana@empresa.com
                  is_active:
                    type: boolean
                    example: true
                  role:
                    type: string
                    enum: [ ROLE_ADMIN, ROLE_EMPLOYEE ]
                    example: ROLE_EMPLOYEE
                required: [ id, name, surname, email, is_active, role ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: No tienes permisos para acceder a este recurso
                required: [ status, error, message ]
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Usuario no encontrado
                required: [ status, error, message ]

    put:
      tags: [ Users ]
      summary: Actualizar usuario
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Ana
                surname:
                  type: string
                  maxLength: 100
                  example: García López
                email:
                  type: string
                  format: email
                  maxLength: 150
                  example: ana@empresa.com
                is_active:
                  type: boolean
                  example: true
                role:
                  type: string
                  enum: [ ROLE_ADMIN, ROLE_EMPLOYEE ]
                  example: ROLE_EMPLOYEE
              required: [ name, surname, email, is_active, role ]
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - El email no es válido
                required: [ status, error, message ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: No tienes permisos para acceder a este recurso
                required: [ status, error, message ]
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Usuario no encontrado
                required: [ status, error, message ]
        "409":
          description: Conflicto - recurso ya existente (ej. email duplicado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 409
                  error:
                    type: string
                    example: Conflict
                  message:
                    type: string
                    example: El email ya está registrado
                required: [ status, error, message ]

    delete:
      tags: [ Users ]
      summary: Borrar usuario
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      responses:
        "204":
          description: Usuario borrado
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: No tienes permisos para acceder a este recurso
                required: [ status, error, message ]
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Usuario no encontrado
                required: [ status, error, message ]

  /users/{id}/projects:
    get:
      tags: [ Users ]
      summary: Listado de proyectos asociados a un usuario
      operationId: getUserProjects
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
        - name: page
          in: query
          description: Página de resultados
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Límites de resultados por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Proyectos asociados al usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    project_user_id:
                      type: string
                      format: uuid
                      example: 00000000-0000-0000-0000-000000000001
                    id:
                      type: string
                      format: uuid
                      example: 00000000-0000-0000-0000-000000000001
                    name:
                      type: string
                      example: Portal Cliente
                    description:
                      type: string
                      nullable: true
                      example: Rediseño del portal de clientes
                    is_active:
                      type: boolean
                      example: true
                    client:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: 00000000-0000-0000-0000-000000000001
                        name:
                          type: string
                          example: Acme Corp
                    team_members:
                      type: integer
                      example: 3
                  required: [ project_user_id, id, name, is_active, client, team_members ]
        "401":
          description: No autenticado - token ausente o inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Token inválido o ausente
                required: [ status, error, message ]
        "403":
          description: Prohibido - permisos insuficientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 403
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: No tienes permisos para acceder a este recurso
                required: [ status, error, message ]
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 404
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: Usuario no encontrado
                required: [ status, error, message ]

  # ================================================================
  #  DASHBOARD
  # ================================================================

  /users/{id}/time-entries:

    post:
      tags: [ Dashboard ]
      summary: Registrar imputación de horas
      operationId: createTimeEntry
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario (UUID v7)
          schema:
            type: string
            format: uuid
            example: 00000000-0000-0000-0000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: 00000000-0000-0000-0000-000000000001
                project_user_id:
                  type: string
                  format: uuid
                  example: 00000000-0000-0000-0000-000000000001
                date:
                  type: string
                  format: date
                  example: "2025-04-09"
                hour:
                  type: number
                  format: decimal
                  minimum: 0.25
                  maximum: 24
                  example: 4.5
                comment:
                  type: string
                  maxLength: 50
                  example: Revisión de PRs
              required: [ project_user_id, date, hour ]
      responses:
        "201":
          description: Imputación creada
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Petición inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Error de validación - Parámetros incorrectos
                required: [ status, error, message ]
        "401":
